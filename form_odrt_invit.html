<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saisie ODRT</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f7f7f9;
    color: #1a1a1a;
  }
  h2 { margin-top: 0; font-size: 18px; }
  h3 { font-size: 15px; margin: 24px 0 10px; border-top: 1px solid #ddd; padding-top: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  select:disabled { background: #eef2fb; color: #1a1a1a; }
  textarea { resize: vertical; min-height: 50px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .partenaire-block {
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .partenaire-block .titre {
    font-weight: 700;
    font-size: 13px;
    color: #2952a3;
    margin-bottom: 6px;
  }
  .partenaire-fields { display: grid; grid-template-columns: 1fr 1fr 1fr 1.3fr 1fr auto; gap: 8px; align-items: end; }
  .btn-remove {
    background: #e05252;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 13px;
    height: 34px;
  }
  .btn-add {
    background: #2952a3;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 6px;
  }
  .btn-submit {
    background: #1a8a3d;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    margin-top: 24px;
    width: 100%;
  }
  .btn-submit:disabled { background: #9ccaa9; cursor: not-allowed; }
  .btn-delete-reunion {
    background: white;
    color: #b3261e;
    border: 1px solid #b3261e;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    width: 100%;
  }
  .btn-delete-reunion:hover { background: #fbe6e6; }
  #message {
    margin-top: 20px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 14px;
    display: none;
  }
  #message.ok { background: #e3f7e9; color: #1a8a3d; display: block; }
  #message.err { background: #fbe6e6; color: #b3261e; display: block; white-space: pre-line; }
  .obligatoire::after { content: " *"; color: #b3261e; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 12px; }
  .compteur { font-size: 12px; color: #666; margin-top: 4px; }

  .mode-bar {
    background: #eef2fb;
    border: 1px solid #c3d0ee;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .mode-bar label { margin-top: 0; }
  .badge-edition {
    display: inline-block;
    background: #2952a3;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .recherche-ecole { position: relative; margin-bottom: 6px; }
  .suggestions {
    position: absolute;
    z-index: 10;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 100%;
    max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .suggestions div {
    padding: 7px 10px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid #eee;
  }
  .suggestions div:hover { background: #eef2fb; }
  .suggestions .vide { color: #888; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: #eef2fb;
    border: 1px solid #c3d0ee;
    border-radius: 14px;
    padding: 5px 8px 5px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip.hors { background: #fbeee6; border-color: #eec9a8; }
  .chip button {
    background: none;
    border: none;
    color: #b3261e;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
</style>
</head>
<body>

<h2 id="titrePage">Saisie d'une réunion ODRT et de ses partenaires à inviter</h2>
<p style="font-size:12px;color:#666;">Les champs marqués d'un * sont obligatoires.</p>

<div class="mode-bar">
  <label>Que voulez-vous faire ?</label>
  <select id="selectReunionExistante">
    <option value="">— Créer une nouvelle réunion —</option>
  </select>
</div>

<label class="obligatoire">Nom de l'ODRT</label>
<input id="nomOdrt" type="text" placeholder="ex. ODRT Châteauneuf en Thymerais - session 1">

<div class="row2">
  <div>
    <label class="obligatoire">Date (jj-mm-aaaa)</label>
    <input id="dateOdrt" type="date">
  </div>
  <div>
    <label class="obligatoire">Horaire</label>
    <div class="row2">
      <input id="horaireDebut" type="time" aria-label="Heure de début">
      <input id="horaireFin" type="time" aria-label="Heure de fin">
    </div>
  </div>
</div>

<div class="row3">
  <div>
    <label class="obligatoire">Rue</label>
    <input id="adresseRue" type="text" placeholder="12 rue de l'École">
  </div>
  <div>
    <label class="obligatoire">Code postal</label>
    <input id="adresseCp" type="text" placeholder="28000" inputmode="numeric" maxlength="5">
  </div>
  <div>
    <label class="obligatoire">Ville</label>
    <input id="adresseVille" type="text" placeholder="Chartres">
  </div>
</div>

<label class="obligatoire">Circonscription</label>
<select id="circonscription"><option value="">Chargement...</option></select>

<h3>Écoles concernées (circonscription sélectionnée ci-dessus)</h3>
<div class="recherche-ecole">
  <input type="text" id="rechercheEcoleCirco" placeholder="Tapez le nom ou l'UAI de l'école...">
  <div class="suggestions" id="suggestionsCirco" style="display:none;"></div>
</div>
<div class="chips" id="chipsCirco"></div>

<h3>École(s) hors circonscription concernées</h3>
<div class="recherche-ecole">
  <input type="text" id="rechercheEcoleHors" placeholder="Tapez le nom ou l'UAI de l'école...">
  <div class="suggestions" id="suggestionsHors" style="display:none;"></div>
</div>
<div class="chips" id="chipsHors"></div>

<h3>Partenaires à inviter</h3>
<div id="partenaires"></div>
<button class="btn-add" id="btnAdd" type="button">+ Ajouter un partenaire</button>
<div class="compteur" id="compteur"></div>

<div id="message"></div>
<button class="btn-submit" id="btnSubmit" type="button">Enregistrer cette réunion et ses partenaires</button>
<button class="btn-delete-reunion" id="btnDeleteReunion" type="button" style="display:none;">Supprimer définitivement cette réunion</button>

<div id="confirmOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:8px;padding:20px 24px;max-width:380px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.25);">
    <p id="confirmMessage" style="margin:0 0 18px 0;white-space:pre-line;font-size:14px;color:#222;"></p>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button id="confirmCancelBtn" type="button" style="padding:6px 14px;border:1px solid #ccc;background:#f5f5f5;border-radius:4px;cursor:pointer;">Annuler</button>
      <button id="confirmOkBtn" type="button" style="padding:6px 14px;border:none;background:#c0392b;color:#fff;border-radius:4px;cursor:pointer;">OK</button>
    </div>
  </div>
</div>

<script>
function confirmerAction(message) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    overlay.style.display = 'flex';
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const nettoyer = (resultat) => {
      overlay.style.display = 'none';
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(resultat);
    };
    const onOk = () => nettoyer(true);
    const onCancel = () => nettoyer(false);
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}
</script>
<script>
// Lignes de Circonscriptions qui servent uniquement aux droits d'accès (IEN DSDEN / ADASEN)
// et ne doivent jamais être proposées comme circonscription d'une réunion.
const CIRCOS_EXCLUES = ['dsden', 'adasen'];

let circonscriptionsById = {};
let circoUnique = null;         // rowId si l'utilisateur ne voit qu'une circonscription (IEN de circonscription)
let toutesLesEcoles = [];
let ecolesCircoChoisies = [];   // {rowId, libelle_ecole, uai_ecole, type_ecole, uai_circo, libelle_circo, invitationRowId}
let ecolesHorsChoisies = [];
let ecolesInviteesASupprimer = [];   // rowId dans Ecoles_invitees, à supprimer à l'enregistrement
let partenairesASupprimer = [];      // rowId dans Partenaires_invites, à supprimer à l'enregistrement
let blocCount = 0;
let reunionEnEditionId = null;       // null = mode création ; sinon rowId de Reunions_ODRT en cours d'édition

function normaliser(txt) {
  return (txt || '').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}

async function chargerEcoles() {
  const table = await grist.docApi.fetchTable('Ecoles');
  toutesLesEcoles = table.id.map((rowId, i) => ({
    rowId,
    uai_ecole: table.uai_ecole[i],
    libelle_ecole: table.libelle_ecole[i],
    type_ecole: table.type_ecole[i],
    uai_circo: table.uai_circo[i],
    libelle_circo: table.libelle_circo[i],
  }));
}

function trouverEcole(rowId) {
  return toutesLesEcoles.find(e => e.rowId === rowId);
}

function uaiCircoSelectionne() {
  const circId = document.getElementById('circonscription').value;
  if (!circId) return null;
  const info = circonscriptionsById[circId];
  return info ? info.uaiCirco : null;
}

function rechercherEcoles(texte, { horsCirco }) {
  const uaiCirco = uaiCircoSelectionne();
  if (!uaiCirco) return [];
  const q = normaliser(texte);
  if (!q) return [];
  return toutesLesEcoles
    .filter(e => horsCirco ? e.uai_circo !== uaiCirco : e.uai_circo === uaiCirco)
    .filter(e => normaliser(e.libelle_ecole).includes(q) || normaliser(e.uai_ecole).includes(q))
    .slice(0, 20);
}

function afficherSuggestions(inputId, suggestionsId, horsCirco, listeChoisie, rerenderChips) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionsId);

  input.addEventListener('input', () => {
    if (!document.getElementById('circonscription').value) {
      box.style.display = 'block';
      box.innerHTML = "<div class=\"vide\">Choisissez d'abord une circonscription ci-dessus.</div>";
      return;
    }
    const resultats = rechercherEcoles(input.value, { horsCirco });
    if (input.value.trim() === '') { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (resultats.length === 0) {
      box.innerHTML = '<div class="vide">Aucune école trouvée.</div>';
      return;
    }
    box.innerHTML = '';
    resultats.forEach(e => {
      const div = document.createElement('div');
      div.textContent = `${e.type_ecole} - ${e.libelle_ecole} (${e.uai_ecole}) — ${e.libelle_circo}`;
      div.addEventListener('click', () => {
        if (!listeChoisie.some(x => x.rowId === e.rowId)) {
          listeChoisie.push({ ...e, invitationRowId: null });
          rerenderChips();
        }
        input.value = '';
        box.style.display = 'none';
      });
      box.appendChild(div);
    });
  });

  document.addEventListener('click', (evt) => {
    if (!box.contains(evt.target) && evt.target !== input) box.style.display = 'none';
  });
}

function retirerEcole(liste, rerenderChips, rowId) {
  const idx = liste.findIndex(x => x.rowId === rowId);
  if (idx === -1) return;
  const [retiree] = liste.splice(idx, 1);
  if (retiree.invitationRowId) {
    ecolesInviteesASupprimer.push(retiree.invitationRowId);
  }
  rerenderChips();
}

function rerenderChipsCirco() {
  const zone = document.getElementById('chipsCirco');
  zone.innerHTML = '';
  ecolesCircoChoisies.forEach(e => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span>${e.type_ecole} - ${e.libelle_ecole} (${e.uai_ecole}) — ${e.libelle_circo}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.addEventListener('click', () => retirerEcole(ecolesCircoChoisies, rerenderChipsCirco, e.rowId));
    chip.appendChild(btn);
    zone.appendChild(chip);
  });
}

function rerenderChipsHors() {
  const zone = document.getElementById('chipsHors');
  zone.innerHTML = '';
  ecolesHorsChoisies.forEach(e => {
    const chip = document.createElement('div');
    chip.className = 'chip hors';
    chip.innerHTML = `<span>${e.type_ecole} - ${e.libelle_ecole} (${e.uai_ecole}) — ${e.libelle_circo}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.addEventListener('click', () => retirerEcole(ecolesHorsChoisies, rerenderChipsHors, e.rowId));
    chip.appendChild(btn);
    zone.appendChild(chip);
  });
}

function ajouterBlocPartenaire(data) {
  blocCount++;
  const div = document.createElement('div');
  div.className = 'partenaire-block';
  div.dataset.rowId = (data && data.rowId) ? String(data.rowId) : '';
  div.innerHTML = `
    <div class="titre">Partenaire</div>
    <div class="partenaire-fields">
      <div><label>Fonction</label><input type="text" class="f-fonction"></div>
      <div><label>Nom</label><input type="text" class="f-nom"></div>
      <div><label>Prénom</label><input type="text" class="f-prenom"></div>
      <div><label>E-mail</label><input type="email" class="f-email"></div>
      <div><label>Téléphone</label><input type="text" class="f-tel"></div>
      <button class="btn-remove" type="button">Retirer</button>
    </div>
  `;
  if (data) {
    div.querySelector('.f-fonction').value = data.fonction || '';
    div.querySelector('.f-nom').value = data.nom || '';
    div.querySelector('.f-prenom').value = data.prenom || '';
    div.querySelector('.f-email').value = data.email || '';
    div.querySelector('.f-tel').value = data.tel || '';
  }
  div.querySelector('.btn-remove').addEventListener('click', () => {
    const rid = div.dataset.rowId;
    if (rid) partenairesASupprimer.push(parseInt(rid, 10));
    div.remove();
    majCompteur();
  });
  document.getElementById('partenaires').appendChild(div);
  majCompteur();
}

function majCompteur() {
  const n = document.querySelectorAll('.partenaire-block').length;
  document.getElementById('compteur').textContent = `${n} partenaire(s) dans la liste`;
}

document.getElementById('btnAdd').addEventListener('click', () => ajouterBlocPartenaire());

function afficherMessage(texte, ok) {
  const el = document.getElementById('message');
  el.textContent = texte;
  el.className = ok ? 'ok' : 'err';
}

function reinitialiserEtatEdition() {
  reunionEnEditionId = null;
  ecolesInviteesASupprimer = [];
  partenairesASupprimer = [];
  document.getElementById('titrePage').innerHTML = "Saisie d'une réunion ODRT et de ses partenaires à inviter";
  document.getElementById('btnSubmit').textContent = "Enregistrer cette réunion et ses partenaires";
  document.getElementById('btnDeleteReunion').style.display = 'none';
}

function viderFormulaire() {
  document.getElementById('nomOdrt').value = '';
  document.getElementById('dateOdrt').value = '';
  document.getElementById('horaireDebut').value = '';
  document.getElementById('horaireFin').value = '';
  document.getElementById('adresseRue').value = '';
  document.getElementById('adresseCp').value = '';
  document.getElementById('adresseVille').value = '';
  // Un IEN de circonscription garde sa circonscription présélectionnée
  document.getElementById('circonscription').value = circoUnique ? String(circoUnique) : '';
  document.getElementById('partenaires').innerHTML = '';
  blocCount = 0;
  ajouterBlocPartenaire();
  ecolesCircoChoisies.splice(0, ecolesCircoChoisies.length);
  ecolesHorsChoisies.splice(0, ecolesHorsChoisies.length);
  rerenderChipsCirco();
  rerenderChipsHors();
}

async function chargerCirconscriptions() {
  // Les permissions font que :
  //  - un IEN de circonscription ne reçoit que SA ligne ;
  //  - un IEN DSDEN / ADASEN reçoit toutes les lignes.
  const table = await grist.docApi.fetchTable('Circonscriptions');
  const select = document.getElementById('circonscription');
  select.innerHTML = '<option value="">— Choisir —</option>';
  circonscriptionsById = {};
  for (let i = 0; i < table.id.length; i++) {
    const rowId = table.id[i];
    const nom = table.Nom_circonscription[i];
    if (CIRCOS_EXCLUES.includes(normaliser(nom).trim())) continue;
    circonscriptionsById[rowId] = { nom, uaiCirco: table.uai_circo[i] };
    const opt = document.createElement('option');
    opt.value = rowId;
    opt.textContent = nom;
    select.appendChild(opt);
  }

  const ids = Object.keys(circonscriptionsById);
  if (ids.length === 0) {
    // Adresse e-mail absente de Circonscriptions.Email_IEN : aucun droit de saisie.
    select.innerHTML = '<option value="">Aucune circonscription accessible</option>';
    select.disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    afficherMessage("Votre adresse e-mail n'est rattachée à aucune circonscription. " +
      "Contactez la DSDEN pour obtenir l'accès à la saisie.", false);
  } else if (ids.length === 1) {
    // IEN de circonscription : sa circonscription est imposée.
    circoUnique = parseInt(ids[0], 10);
    select.value = ids[0];
    select.disabled = true;
  }
}

function isoDepuisTimestampGrist(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toISOString().slice(0, 10);
}

function dateFrDepuisTimestampGrist(ts) {
  const iso = isoDepuisTimestampGrist(ts);
  if (!iso) return '';
  const [a, m, j] = iso.split('-');
  return `${j}-${m}-${a}`;
}

function parseHoraire(horaire) {
  // Formats attendus : "14h00-16h30", parfois anciens formats "14h-16h"
  const m = /^(\d{1,2})h(\d{2})?\s*-\s*(\d{1,2})h(\d{2})?$/i.exec((horaire || '').trim());
  if (!m) return { debut: '', fin: '' };
  const pad = (v) => String(v).padStart(2, '0');
  const debut = `${pad(m[1])}:${m[2] ? pad(m[2]) : '00'}`;
  const fin = `${pad(m[3])}:${m[4] ? pad(m[4]) : '00'}`;
  return { debut, fin };
}

function parseLieu(lieu) {
  // Format attendu : "12 rue de l'École, 28000 Chartres"
  const parts = (lieu || '').split(',');
  const rue = (parts[0] || '').trim();
  const reste = (parts.slice(1).join(',') || '').trim();
  const m = /^(\d{5})\s+(.*)$/.exec(reste);
  if (m) return { rue, cp: m[1], ville: m[2].trim() };
  return { rue, cp: '', ville: reste };
}

async function chargerListeReunions() {
  const select = document.getElementById('selectReunionExistante');
  select.innerHTML = '<option value="">— Créer une nouvelle réunion —</option>';
  try {
    const table = await grist.docApi.fetchTable('Reunions_ODRT');
    const lignes = table.id.map((rowId, i) => ({
      rowId,
      nom: table.Nom_ODRT[i],
      date: table.Date_ODRT[i],
    }));
    lignes.sort((a, b) => (b.date || 0) - (a.date || 0));
    if (lignes.length > 0) {
      const groupe = document.createElement('optgroup');
      groupe.label = '— Modifier une réunion —';
      lignes.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.rowId;
        const dateAffichee = l.date ? dateFrDepuisTimestampGrist(l.date) : 'date inconnue';
        opt.textContent = `${l.nom} — ${dateAffichee}`;
        groupe.appendChild(opt);
      });
      select.appendChild(groupe);
    }
  } catch (e) {
    console.error(e);
  }
}

async function chargerReunionPourEdition(rowId) {
  afficherMessage('Chargement de la réunion...', true);
  try {
    const [tblReunions, tblEcoles, tblPartenaires] = await Promise.all([
      grist.docApi.fetchTable('Reunions_ODRT'),
      grist.docApi.fetchTable('Ecoles_invitees'),
      grist.docApi.fetchTable('Partenaires_invites'),
    ]);

    const idx = tblReunions.id.indexOf(rowId);
    if (idx === -1) {
      afficherMessage("Cette réunion n'est plus accessible.", false);
      return;
    }

    reinitialiserEtatEdition();
    reunionEnEditionId = rowId;

    document.getElementById('nomOdrt').value = tblReunions.Nom_ODRT[idx] || '';
    document.getElementById('dateOdrt').value = isoDepuisTimestampGrist(tblReunions.Date_ODRT[idx]);
    const { debut, fin } = parseHoraire(tblReunions.Horaire[idx]);
    document.getElementById('horaireDebut').value = debut;
    document.getElementById('horaireFin').value = fin;
    const { rue, cp, ville } = parseLieu(tblReunions.Lieu[idx]);
    document.getElementById('adresseRue').value = rue;
    document.getElementById('adresseCp').value = cp;
    document.getElementById('adresseVille').value = ville;
    const circId = tblReunions.Circonscription[idx];
    if (circId) document.getElementById('circonscription').value = String(circId);

    // Écoles liées à cette réunion
    ecolesCircoChoisies.splice(0, ecolesCircoChoisies.length);
    ecolesHorsChoisies.splice(0, ecolesHorsChoisies.length);
    for (let i = 0; i < tblEcoles.id.length; i++) {
      if (tblEcoles.Reunion[i] !== rowId) continue;
      const ecoleRowId = tblEcoles.Nom_ecole[i];
      const infoEcole = trouverEcole(ecoleRowId);
      if (!infoEcole) continue;
      const entree = { ...infoEcole, invitationRowId: tblEcoles.id[i] };
      if (tblEcoles.Hors_circonscription[i]) {
        ecolesHorsChoisies.push(entree);
      } else {
        ecolesCircoChoisies.push(entree);
      }
    }
    rerenderChipsCirco();
    rerenderChipsHors();

    // Partenaires liés à cette réunion
    document.getElementById('partenaires').innerHTML = '';
    blocCount = 0;
    let nbPartenaires = 0;
    for (let i = 0; i < tblPartenaires.id.length; i++) {
      if (tblPartenaires.Reunion[i] !== rowId) continue;
      ajouterBlocPartenaire({
        rowId: tblPartenaires.id[i],
        fonction: tblPartenaires.Fonction[i],
        nom: tblPartenaires.Nom[i],
        prenom: tblPartenaires.Prenom[i],
        email: tblPartenaires.Email[i],
        tel: tblPartenaires.Tel[i],
      });
      nbPartenaires++;
    }
    if (nbPartenaires === 0) ajouterBlocPartenaire();

    document.getElementById('titrePage').innerHTML =
      "Modifier une réunion ODRT" + '<span class="badge-edition">édition</span>';
    document.getElementById('btnSubmit').textContent = "Enregistrer les modifications";
    document.getElementById('btnDeleteReunion').style.display = 'block';

    afficherMessage('', false);
    document.getElementById('message').className = '';
    document.getElementById('message').style.display = 'none';
  } catch (e) {
    console.error(e);
    afficherMessage("Impossible de charger cette réunion : " + (e.message || e), false);
  }
}

document.getElementById('selectReunionExistante').addEventListener('change', (evt) => {
  const val = evt.target.value;
  if (!val) {
    reinitialiserEtatEdition();
    viderFormulaire();
  } else {
    chargerReunionPourEdition(parseInt(val, 10));
  }
});

function emailValide(email) {
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
}

function telChiffres(tel) {
  return (tel || '').replace(/\D/g, '');
}

function telValide(tel) {
  return telChiffres(tel).length === 10;
}

function telFormate(tel) {
  const d = telChiffres(tel);
  return d.match(/.{1,2}/g).join(' ');
}

function formatDateFr(isoDate) {
  // input type=date renvoie "aaaa-mm-jj" -> on convertit en timestamp Grist (secondes, UTC minuit)
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00Z');
  return Math.floor(d.getTime() / 1000);
}

function messageErreurGrist(e) {
  const txt = (e && e.message) ? e.message : String(e);
  if (/blocked by|access rules|permission|acl/i.test(txt)) {
    return "Action refusée : vous ne pouvez gérer que les réunions de votre propre circonscription.\n(" + txt + ")";
  }
  return "Erreur : " + txt;
}

async function enregistrer() {
  const btn = document.getElementById('btnSubmit');
  const nomOdrt = document.getElementById('nomOdrt').value.trim();
  const dateOdrt = document.getElementById('dateOdrt').value;
  const horaireDebut = document.getElementById('horaireDebut').value;
  const horaireFin = document.getElementById('horaireFin').value;
  const rue = document.getElementById('adresseRue').value.trim();
  const cp = document.getElementById('adresseCp').value.trim();
  const ville = document.getElementById('adresseVille').value.trim();
  const circId = document.getElementById('circonscription').value;

  const erreurs = [];

  if (!nomOdrt) erreurs.push("Le nom de l'ODRT est obligatoire.");
  if (!dateOdrt) erreurs.push("La date est obligatoire.");
  if (!horaireDebut || !horaireFin) {
    erreurs.push("L'heure de début ET l'heure de fin sont obligatoires.");
  } else if (horaireFin <= horaireDebut) {
    erreurs.push("L'heure de fin doit être postérieure à l'heure de début.");
  }
  if (!rue) erreurs.push("La rue est obligatoire.");
  if (!cp || !/^\d{5}$/.test(cp)) erreurs.push("Le code postal doit contenir 5 chiffres.");
  if (!ville) erreurs.push("La ville est obligatoire.");
  if (!circId) erreurs.push("La circonscription est obligatoire.");
  if (ecolesCircoChoisies.length === 0) {
    erreurs.push("Au moins une école de la circonscription est obligatoire.");
  }

  const blocs = document.querySelectorAll('.partenaire-block');
  const partenairesNouveaux = [];
  const partenairesAMettreAJour = [];
  blocs.forEach((b, i) => {
    const fonction = b.querySelector('.f-fonction').value.trim();
    const nom = b.querySelector('.f-nom').value.trim();
    const prenom = b.querySelector('.f-prenom').value.trim();
    const email = b.querySelector('.f-email').value.trim();
    const tel = b.querySelector('.f-tel').value.trim();
    const rempli = fonction || nom || prenom || email || tel;
    if (!rempli) return; // bloc totalement vide, on l'ignore silencieusement

    const num = i + 1;
    if (!nom) erreurs.push(`Partenaire ${num} : le nom est obligatoire.`);
    if (!prenom) erreurs.push(`Partenaire ${num} : le prénom est obligatoire.`);
    if (!email) {
      erreurs.push(`Partenaire ${num} : l'e-mail est obligatoire.`);
    } else if (!emailValide(email)) {
      erreurs.push(`Partenaire ${num} : l'e-mail n'est pas dans un format valide.`);
    }
    if (tel && !telValide(tel)) {
      erreurs.push(`Partenaire ${num} : le téléphone doit contenir 10 chiffres (ou laissez-le vide).`);
    }

    const donnees = {
      fonction, nom, prenom, email,
      tel: telValide(tel) ? telFormate(tel) : tel,
    };
    const rid = b.dataset.rowId;
    if (rid) {
      partenairesAMettreAJour.push({ rowId: parseInt(rid, 10), ...donnees });
    } else {
      partenairesNouveaux.push(donnees);
    }
  });

  if (partenairesNouveaux.length === 0 && partenairesAMettreAJour.length === 0) {
    erreurs.push('Ajoutez au moins un partenaire.');
  }

  if (erreurs.length > 0) {
    afficherMessage('Merci de corriger les points suivants avant d’enregistrer :\n• ' + erreurs.join('\n• '), false);
    document.getElementById('message').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const horaire = `${horaireDebut.replace(':', 'h')}-${horaireFin.replace(':', 'h')}`;
  const lieu = `${rue}, ${cp} ${ville}`;

  btn.disabled = true;
  afficherMessage('Enregistrement en cours...', true);

  try {
    let reunionRowId;
    const champsReunion = {
      Nom_ODRT: nomOdrt,
      Date_ODRT: formatDateFr(dateOdrt),
      Horaire: horaire,
      Lieu: lieu,
      Circonscription: parseInt(circId, 10),
    };

    if (reunionEnEditionId) {
      reunionRowId = reunionEnEditionId;
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Reunions_ODRT', reunionRowId, champsReunion],
      ]);
    } else {
      const resultReunion = await grist.docApi.applyUserActions([
        ['AddRecord', 'Reunions_ODRT', null, champsReunion],
      ]);
      reunionRowId = resultReunion.retValues[0];
    }

    // Suppression des écoles et partenaires retirés du formulaire
    if (ecolesInviteesASupprimer.length > 0) {
      await grist.docApi.applyUserActions([
        ['BulkRemoveRecord', 'Ecoles_invitees', ecolesInviteesASupprimer],
      ]);
    }
    if (partenairesASupprimer.length > 0) {
      await grist.docApi.applyUserActions([
        ['BulkRemoveRecord', 'Partenaires_invites', partenairesASupprimer],
      ]);
    }

    // Ajout des nouvelles écoles (celles sans invitationRowId)
    const ecolesAAjouter = [
      ...ecolesCircoChoisies.filter(e => !e.invitationRowId).map(e => ({ rowId: e.rowId, hors: false })),
      ...ecolesHorsChoisies.filter(e => !e.invitationRowId).map(e => ({ rowId: e.rowId, hors: true })),
    ];
    if (ecolesAAjouter.length > 0) {
      await grist.docApi.applyUserActions([
        ['BulkAddRecord', 'Ecoles_invitees', ecolesAAjouter.map(() => null), {
          Reunion: ecolesAAjouter.map(() => reunionRowId),
          Nom_ecole: ecolesAAjouter.map(e => e.rowId),
          Hors_circonscription: ecolesAAjouter.map(e => e.hors),
        }],
      ]);
    }

    // Mise à jour des partenaires existants modifiés
    if (partenairesAMettreAJour.length > 0) {
      await grist.docApi.applyUserActions([
        ['BulkUpdateRecord', 'Partenaires_invites',
          partenairesAMettreAJour.map(p => p.rowId),
          {
            Fonction: partenairesAMettreAJour.map(p => p.fonction),
            Nom: partenairesAMettreAJour.map(p => p.nom),
            Prenom: partenairesAMettreAJour.map(p => p.prenom),
            Email: partenairesAMettreAJour.map(p => p.email),
            Tel: partenairesAMettreAJour.map(p => p.tel),
          },
        ],
      ]);
    }

    // Ajout des nouveaux partenaires
    if (partenairesNouveaux.length > 0) {
      await grist.docApi.applyUserActions([
        ['BulkAddRecord', 'Partenaires_invites', partenairesNouveaux.map(() => null), {
          Reunion: partenairesNouveaux.map(() => reunionRowId),
          Fonction: partenairesNouveaux.map(p => p.fonction),
          Nom: partenairesNouveaux.map(p => p.nom),
          Prenom: partenairesNouveaux.map(p => p.prenom),
          Email: partenairesNouveaux.map(p => p.email),
          Tel: partenairesNouveaux.map(p => p.tel),
        }],
      ]);
    }

    const totalPartenaires = partenairesNouveaux.length + partenairesAMettreAJour.length;
    const totalEcoles = ecolesCircoChoisies.length + ecolesHorsChoisies.length;
    const verbe = reunionEnEditionId ? 'mise à jour' : 'enregistrée';
    afficherMessage(`✅ Réunion "${nomOdrt}" ${verbe} avec succès : ${totalPartenaires} partenaire(s) et ${totalEcoles} école(s).`, true);
    document.getElementById('message').scrollIntoView({ behavior: 'smooth', block: 'center' });

    reinitialiserEtatEdition();
    viderFormulaire();
    document.getElementById('selectReunionExistante').value = '';
    chargerListeReunions();
  } catch (e) {
    console.error(e);
    afficherMessage(messageErreurGrist(e), false);
    document.getElementById('message').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } finally {
    btn.disabled = false;
  }
}

async function supprimerReunion() {
  if (!reunionEnEditionId) return;
  const nom = document.getElementById('nomOdrt').value || 'cette réunion';
  const ok = await confirmerAction(
    `Supprimer définitivement "${nom}" ainsi que tous ses partenaires et écoles associés ?\n` +
    `Cette action est irréversible.`
  );
  if (!ok) return;

  const btn = document.getElementById('btnDeleteReunion');
  btn.disabled = true;
  afficherMessage('Suppression en cours...', true);

  try {
    const [tblEcoles, tblPartenaires] = await Promise.all([
      grist.docApi.fetchTable('Ecoles_invitees'),
      grist.docApi.fetchTable('Partenaires_invites'),
    ]);
    const idsEcoles = tblEcoles.id.filter((_, i) => tblEcoles.Reunion[i] === reunionEnEditionId);
    const idsPartenaires = tblPartenaires.id.filter((_, i) => tblPartenaires.Reunion[i] === reunionEnEditionId);

    if (idsEcoles.length > 0) {
      await grist.docApi.applyUserActions([['BulkRemoveRecord', 'Ecoles_invitees', idsEcoles]]);
    }
    if (idsPartenaires.length > 0) {
      await grist.docApi.applyUserActions([['BulkRemoveRecord', 'Partenaires_invites', idsPartenaires]]);
    }
    await grist.docApi.applyUserActions([['RemoveRecord', 'Reunions_ODRT', reunionEnEditionId]]);

    afficherMessage(`✅ "${nom}" a été supprimée.`, true);
    document.getElementById('message').scrollIntoView({ behavior: 'smooth', block: 'center' });

    reinitialiserEtatEdition();
    viderFormulaire();
    document.getElementById('selectReunionExistante').value = '';
    chargerListeReunions();
  } catch (e) {
    console.error(e);
    afficherMessage(messageErreurGrist(e), false);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('btnSubmit').addEventListener('click', enregistrer);
document.getElementById('btnDeleteReunion').addEventListener('click', supprimerReunion);

grist.ready({ requiredAccess: 'full' });
grist.onOptions(() => {}); // pas d'options particulières
chargerCirconscriptions().catch(e => afficherMessage("Impossible de charger les circonscriptions : " + (e.message || e), false));
chargerEcoles().catch(e => afficherMessage("Impossible de charger les écoles : " + (e.message || e), false));
chargerListeReunions();
ajouterBlocPartenaire();
afficherSuggestions('rechercheEcoleCirco', 'suggestionsCirco', false, ecolesCircoChoisies, rerenderChipsCirco);
afficherSuggestions('rechercheEcoleHors', 'suggestionsHors', true, ecolesHorsChoisies, rerenderChipsHors);
</script>
